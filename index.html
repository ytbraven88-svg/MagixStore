<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MagixStore - E-Commerce</title>
    <style>
        :root {
            --primary-color: #03ac03;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --border-color: #e5e7eb;
            --danger: #ff5722;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
        header { background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 20px; font-weight: bold; color: var(--primary-color); cursor: pointer; }
        .nav-buttons { display: flex; gap: 10px; }
        .nav-btn { background-color: var(--primary-color); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .nav-btn.secondary { background-color: #555; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .section-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .product-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; }
        .product-name { font-size: 14px; font-weight: 500; margin: 0 0 8px 0; }
        .product-price { font-size: 16px; font-weight: bold; color: var(--danger); margin-bottom: 10px; }
        .btn { background-color: transparent; color: var(--primary-color); border: 1px solid var(--primary-color); border-radius: 6px; padding: 8px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn:hover { background-color: var(--primary-color); color: white; }
        .page-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-top: 20px; display: none; }
        .cart-item, .order-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding: 10px 0; }
        .qty-control button { padding: 2px 8px; background: #ddd; border: none; cursor: pointer; font-weight: bold; }
        .total-box { font-size: 18px; font-weight: bold; margin: 15px 0; text-align: right; }
        .btn-checkout { background-color: var(--danger); color: white; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        
        /* Modal Notifikasi / Surat Elektronik (Invoice) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: white; width: 90%; max-width: 500px; border-radius: 8px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        .invoice-header { border-bottom: 2px dashed #ddd; padding-bottom: 10px; margin-bottom: 15px; }
        .invoice-header h2 { margin: 0; color: var(--primary-color); font-size: 20px; }
        .invoice-header p { margin: 2px 0; font-size: 12px; color: #666; }
        .invoice-body { font-size: 14px; margin-bottom: 15px; }
        .invoice-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .invoice-table th, .invoice-table td { border-bottom: 1px solid #eee; padding: 8px; text-align: left; font-size: 13px; }
        .invoice-table th { background-color: #f9fafb; }
        .badge-success { background: #d1fae5; color: #065f46; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="showPage('catalog-view')">MagixStore</div>
        <div class="nav-buttons">
            <button class="nav-btn secondary" onclick="loadOrders()">Riwayat Pesanan</button>
            <button class="nav-btn" onclick="showPage('cart-view')">Keranjang (<span id="cart-count">0</span>)</button>
        </div>
    </header>

    <div class="container">
        <!-- KATALOG PRODUK -->
        <div id="catalog-view" class="page-section" style="display: block;">
            <div class="section-title">Katalog Produk Pilihan</div>
            <div class="product-grid" id="product-list"></div>
        </div>

        <!-- HALAMAN KERANJANG -->
        <div id="cart-view" class="page-section">
            <div class="section-title">Keranjang Belanja Anda</div>
            <div id="cart-items-container"><p>Keranjang masih kosong.</p></div>
            <div class="total-box">Total: Rp <span id="cart-total">0</span></div>
            <button class="btn-checkout" onclick="proceedCheckout()">Lanjut ke Pembayaran</button>
        </div>

        <!-- HALAMAN CHECKOUT -->
        <div id="checkout-view" class="page-section">
            <div class="section-title">Simulasi Pembayaran (Checkout)</div>
            <p>Pilih Metode Pembayaran:</p>
            <label><input type="radio" name="payment" checked> QRIS / ShopeePay</label><br><br>
            <label><input type="radio" name="payment"> Transfer Bank (BCA/Mandiri)</label><br><br>
            <button class="btn-checkout" onclick="finishOrder()">Bayar Sekarang</button>
        </div>

        <!-- HALAMAN RIWAYAT PESANAN -->
        <div id="orders-view" class="page-section">
            <div class="section-title">Riwayat Pesanan di Server (Backend)</div>
            <div id="orders-container"><p>Memuat riwayat pesanan...</p></div>
        </div>
    </div>

    <!-- MODAL SURAT ELEKTRONIK / INVOICE -->
    <div id="invoice-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="invoice-header">
                <h2>MAGIXSTORE E-RECEIPT</h2>
                <p>Notifikasi Resmi Surat Elektronik Transaksi</p>
            </div>
            <div class="invoice-body" id="invoice-content">
                <!-- Isi Surat Elektronik Dinamis -->
            </div>
            <button class="btn" onclick="closeInvoiceModal()" style="background-color: var(--primary-color); color: white;">Tutup & Kembali Belanja</button>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Kemeja Flanel Casual Pria", price: 125000 },
            { id: 2, name: "Sepatu Sneakers Olahraga", price: 249000 },
            { id: 3, name: "Tas Ransel Laptop Anti Air", price: 185000 },
            { id: 4, name: "Botol Minum Termos Stainless", price: 65000 }
        ];
        let cart = [];

        function renderProducts() {
            document.getElementById('product-list').innerHTML = products.map(p => `
                <div class="product-card">
                    <h3 class="product-name">${p.name}</h3>
                    <div class="product-price">Rp ${p.price.toLocaleString()}</div>
                    <button class="btn" onclick="addToCart(${p.id})">+ Keranjang</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if (existing) { existing.qty++; } else { cart.push({ ...product, qty: 1 }); }
            updateCartUI();
            showNotification("Berhasil ditambahkan ke keranjang!");
        }

        // Notifikasi Menarik (Toast/Popup kecil)
        function showNotification(msg) {
            let notif = document.createElement('div');
            notif.innerText = msg;
            notif.style.cssText = "position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 10px 20px; border-radius: 6px; z-index: 2000; font-size: 14px; box-shadow: 0 3px 10px rgba(0,0,0,0.3);";
            document.body.appendChild(notif);
            setTimeout(() => { notif.remove(); }, 2500);
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
            const container = document.getElementById('cart-items-container');
            if (cart.length === 0) {
                container.innerHTML = "<p>Keranjang masih kosong.</p>";
                document.getElementById('cart-total').innerText = "0";
                return;
            }
            let total = 0;
            container.innerHTML = cart.map(item => {
                total += item.price * item.qty;
                return `
                    <div class="cart-item">
                        <div><strong>${item.name}</strong><br>Rp ${item.price.toLocaleString()} x ${item.qty}</div>
                        <div class="qty-control">
                            <button onclick="changeQty(${item.id}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button onclick="changeQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('cart-total').innerText = total.toLocaleString();
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) { cart = cart.filter(i => i.id !== id); }
            }
            updateCartUI();
        }

        function showPage(pageId) {
            document.querySelectorAll('.page-section').forEach(el => el.style.display = 'none');
            document.getElementById(pageId).style.display = 'block';
        }

        function proceedCheckout() {
            if (cart.length === 0) { alert("Keranjang kosong!"); return; }
            showPage('checkout-view');
        }

        async function finishOrder() {
            if (cart.length === 0) { alert("Keranjang kosong!"); return; }
            try {
                const response = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items: cart })
                });
                const result = await response.json();
                if (result.success) {
                    // Tampilkan Surat Elektronik (Invoice) yang elegan
                    showInvoiceModal(result.orderId, cart, result.date || new Date().toLocaleString('id-ID'));
                    cart = [];
                    updateCartUI();
                } else {
                    alert("Gagal memproses pesanan.");
                }
            } catch (error) {
                alert("Terjadi kesalahan koneksi ke backend.");
            }
        }

        function showInvoiceModal(orderId, items, date) {
            let total = items.reduce((sum, i) => sum + (i.price * i.qty), 0);
            let content = `
                <p><strong>Status:</strong> <span class="badge-success">PEMBAYARAN BERHASIL (LUNAS)</span></p>
                <p><strong>No. Resi / Invoice:</strong> ${orderId}</p>
                <p><strong>Waktu Transaksi:</strong> ${date}</p>
                <p><strong>Kepada Yth. Pelanggan MagixStore</strong></p>
                <hr style="border:0; border-top:1px solid #eee; margin:10px 0;">
                <p style="font-weight:bold; margin-bottom:5px;">Rincian Barang:</p>
                <table class="invoice-table">
                    <tr><th>Produk</th><th>Qty</th><th>Subtotal</th></tr>
                    ${items.map(i => `<tr><td>${i.name}</td><td>${i.qty}</td><td>Rp ${(i.price * i.qty).toLocaleString()}</td></tr>`).join('')}
                </table>
                <p style="text-align:right; font-size:16px; font-weight:bold; margin-top:10px;">Total Pembayaran: Rp ${total.toLocaleString()}</p>
                <p style="font-size:11px; color:#777; text-align:center; margin-top:15px;">Terima kasih telah berbelanja di MagixStore. Surat elektronik ini sah diterbitkan secara otomatis oleh sistem server Vercel.</p>
            `;
            document.getElementById('invoice-content').innerHTML = content;
            document.getElementById('invoice-modal').style.display = 'flex';
        }

        function closeInvoiceModal() {
            document.getElementById('invoice-modal').style.display = 'none';
            showPage('catalog-view');
        }

        async function loadOrders() {
            showPage('orders-view');
            const container = document.getElementById('orders-container');
            container.innerHTML = "<p>Memuat data dari server...</p>";

            try {
                const response = await fetch('/api/checkout');
                const result = await response.json();

                if (result.success && result.orders.length > 0) {
                    container.innerHTML = result.orders.map(o => `
                        <div class="order-item" style="flex-direction: column; align-items: flex-start; gap: 5px;">
                            <div><strong>No: ${o.orderId}</strong> <span style="font-size: 12px; color: #777;">(${o.date})</span></div>
                            <div style="font-size: 13px; color: #555;">Produk: ${o.items.map(i => `${i.name} (${i.qty}x)`).join(', ')}</div>
                            <div style="font-weight: bold; color: var(--danger);">Total: Rp ${o.total.toLocaleString()}</div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = "<p>Belum ada pesanan yang tercatat di server.</p>";
                }
            } catch (error) {
                container.innerHTML = "<p>Gagal mengambil riwayat pesanan dari server.</p>";
            }
        }

        renderProducts();
    </script>
</body>
</html>
